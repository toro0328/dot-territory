name: Update social preview card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-og-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix zero-morale occupation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="if(state.occupy){drainOccupationMorale(now);if(state.occupy.progress>=state.occupy.required)finishOccupation()}tickComputers(now);save();render()"
          new="if(state.occupy){drainOccupationMorale(now);if(state.morale<=0&&(state.occupy.type==='raid'||state.occupy.type==='reclaim')){cancelOccupation('気力が0になったため占領を中断した。家や休憩所で回復しよう。')}else if(state.occupy&&state.occupy.progress>=state.occupy.required)finishOccupation()}tickComputers(now);save();render()"
          if old not in s:
              raise SystemExit('target occupation tick not found')
          s=s.replace(old,new)
          # resumeOffline has the same sequence; replace any remaining occurrence too.
          s=s.replace(old,new)
          p.write_text(s)
          PY
          sed -i -E 's#game\.js\?v=[0-9]+#game.js?v=69#g' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git commit -m "Stop territory capture when morale reaches zero" || exit 0
          git push origin main
