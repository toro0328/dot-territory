name: Update social preview card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-og-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Open Graph image
        run: |
          sed -i 's#share-card\.png?v=1#share-card-ja.jpg?v=2#g' index.html
          sed -i 's#KOMOREBI FRONTIER — A Pixel Territory RPG#こもれび開拓団 — ピクセル領地RPG#g' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use Japanese social preview card"
          git push origin main
